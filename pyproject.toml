# Packages the two tools a person runs, not the census: the collector and the
# renderer stay in the repository, where the daily workflow runs them. Installed,
# both tools read the published index instead of a checkout.
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
# `agent-vitals` on PyPI is someone else's project; this one ships as mcp-vitals.
name = "mcp-vitals"
version = "0.1.0"
description = "Check the MCP servers on your machine: is the repository behind each one still maintained, licensed, pinned? Plus a daily census of the agent tooling ecosystem, over MCP."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Kerem Özdemir" }]
keywords = ["mcp", "model-context-protocol", "mcp-server", "claude-code", "ai-agents", "supply-chain", "licence"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Repository = "https://github.com/Keremozdemirra/agent-vitals"
Issues = "https://github.com/Keremozdemirra/agent-vitals/issues"

[project.scripts]
mcp-vitals = "doctor:main"
mcp-vitals-server = "mcp_server:main"

[tool.setuptools]
py-modules = ["doctor", "mcp_server"]
