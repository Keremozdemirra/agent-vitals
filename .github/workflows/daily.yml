name: daily census

# 07:00 UTC — 09:00 in Berlin during CEST, 08:00 during CET. Cron has no
# daylight-saving awareness; the contribution graph uses UTC days anyway.
# Two slots, not one. GitHub's own documentation warns that the schedule event
# is delayed under load, and the first scheduled run of this workflow never
# fired at all. A daily obligation carried by a single cron slot is a daily
# obligation you find out about after it has already been missed. The second
# slot is a no-op on any day the first one worked.
on:
  schedule:
    - cron: "0 7 * * *"
    - cron: "0 12 * * *"
  workflow_dispatch:

# The only permission this job needs. No personal access token exists anywhere
# in this repository: GITHUB_TOKEN is minted per run and scoped to this repo.
permissions:
  contents: write

concurrency:
  group: daily-census
  cancel-in-progress: false

jobs:
  census:
    runs-on: ubuntu-latest
    # Measured on this runner: ~945 results/minute against the search API's
    # 30-requests-per-minute limit. Thirteen queries across two tiers is roughly
    # 60,000 gross results, so about an hour. The ceiling is slack, not a target.
    timeout-minutes: 180
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Has today's census already run?
        id: guard
        run: |
          set -euo pipefail
          if [ -f "data/daily/$(date -u +%F).json" ]; then
            echo "done=true" >> "$GITHUB_OUTPUT"
            echo "today's census is already committed; this run has nothing to do"
          else
            echo "done=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect
        if: steps.guard.outputs.done != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 collect.py

      - name: Render
        if: steps.guard.outputs.done != 'true'
        run: python3 render.py

      - name: Commit
        if: steps.guard.outputs.done != 'true'
        run: |
          set -euo pipefail
          git config user.name "Kerem Özdemir"
          git config user.email "151446743+Keremozdemirra@users.noreply.github.com"
          git add data README.md docs
          if git diff --cached --quiet; then
            echo "nothing changed; not committing"
            exit 0
          fi
          COUNT=$(python3 -c "import json,pathlib;d=json.loads(pathlib.Path('data/servers.json').read_text());print(d['count'])")
          NEW=$(python3 -c "import json,glob;f=sorted(glob.glob('data/daily/*.json'))[-1];print(json.load(open(f))['churn']['arrived_count'])")
          git commit -m "census $(date -u +%F): ${COUNT} repositories, +${NEW} new"
          git push
