name: test

# doctor.py and the MCP server, against fixtures. No network, no token.
on:
  push:
    paths: ["doctor.py", "mcp_server.py", "tests/**", "pyproject.toml", ".github/workflows/test.yml"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: pip install . && mcp-vitals --offline --version
